name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only one job (profile = time each system of the daily tick)"
        type: choice
        options: [all, profile, windows]
        default: all
  schedule:
    - cron: '17 11 * * *'

jobs:
  core-tests:
    name: Simulation tests
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test GezCore
        run: swift test --package-path Packages/GezCore

  core-tests-linux:
    # Same tests on Linux: runs even when Mac runners are scarce, and proves
    # the simulation has no Apple-only code (a Windows port depends on it).
    name: Simulation tests (Linux)
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Test GezCore
        run: swift test --package-path Packages/GezCore


  core-tests-windows:
    # The simulation on Windows: the Godot version (and any Windows release)
    # runs this same Swift code. A red job here is a real portability bug.
    name: Simulation tests (Windows)
    if: github.event_name != 'schedule' && inputs.only != 'profile'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Test GezCore
        run: swift test --package-path Packages/GezCore
  godot-extension:
    # The SwiftGodot extension that connects GezCore to the Godot screens.
    name: Godot extension (macOS)
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          ls /Applications | grep -i xcode || true
          swift --version
      - name: Build and test GezGodot
        run: |
          if [ -d godot/swift ]; then
            swift test --package-path godot/swift
          else
            echo "no godot/ folder on this branch"
          fi

  long-tests-linux:
    # The decade-long simulations (skipped in the jobs above). Runs daily, on
    # every push to main, and by hand, so pull requests stay fast.
    name: Long simulation tests (Linux)
    if: github.event_name != 'pull_request' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 150
    env:
      GEZ_LONG_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Long simulations
        run: swift test --package-path Packages/GezCore --filter 'testTenYearsStaysBounded|tenYearHeadlessRun|testLifeGoesOn|testVassalLinesGoOn|testTwentyYearsStayInBounds'

  app-build:
    name: Build Mac and iPad apps
    # Intel Mac runners: arm64 ones are often queued for a long time. The
    # snapshot job below still needs arm64 for Metal.
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build Mac app
        run: >
          xcodebuild -project Gez.xcodeproj -scheme GezMac
          -destination 'generic/platform=macOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Build iPad app
        run: >
          xcodebuild -project Gez.xcodeproj -scheme GeziPad
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO build

  snapshots:
    name: Render map snapshots
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Run snapshot tests
        env:
          GEZ_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
          TEST_RUNNER_GEZ_SNAPSHOT_DIR: ${{ github.workspace }}/snapshots
        run: >
          xcodebuild -project Gez.xcodeproj -scheme GezMac
          -destination 'platform=macOS'
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO
          test
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: snapshots
          if-no-files-found: warn
      - name: Publish snapshots to the ci-snapshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          WORKDIR="${RUNNER_TEMP}/ci-snapshots-apple"
          rm -rf "$WORKDIR"
          if git clone --depth 1 --branch ci-snapshots "$REPO_URL" "$WORKDIR" 2>/dev/null; then
            find "$WORKDIR" -maxdepth 1 -type f -name '*.png' -delete
          else
            git init -q "$WORKDIR"
            git -C "$WORKDIR" checkout -q --orphan ci-snapshots
            git -C "$WORKDIR" remote add origin "$REPO_URL"
          fi
          cp -f snapshots/*.png "$WORKDIR/"
          cd "$WORKDIR"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "Snapshots for ${GITHUB_SHA}" || exit 0
          for i in 1 2 3; do
            git push -q origin ci-snapshots && break
            git fetch -q origin ci-snapshots && git rebase -q origin/ci-snapshots
          done

  godot-build-mac:
    name: Build & export Godot game (macOS)
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_DIR_VERSION: 4.7.2.stable
    steps:
      - uses: actions/checkout@v5
      - name: Build GezGodot (macOS release)
        run: ./godot/build_mac.sh release
      - name: Install Godot & export templates
        run: |
          mkdir -p "${RUNNER_TEMP}/godot"
          curl -fsSL -o "${RUNNER_TEMP}/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_macos.universal.zip"
          unzip -q "${RUNNER_TEMP}/godot/godot.zip" -d "${RUNNER_TEMP}/godot"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -o "${RUNNER_TEMP}/godot/templates.tpz" -d "${RUNNER_TEMP}/godot/tpl"
          cp -R "${RUNNER_TEMP}/godot/tpl/templates/"* "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_DIR_VERSION}/"
      - name: Export Godot game (macOS)
        run: |
          GODOT_BIN="${RUNNER_TEMP}/godot/Godot.app/Contents/MacOS/Godot"
          "$GODOT_BIN" --headless --path godot --import
          mkdir -p godot/build/mac
          "$GODOT_BIN" --headless --path godot --export-release "macOS" build/mac/Gez.app
          ./godot/stage_resources.sh godot/build/mac/Gez.app/Contents/Resources
          codesign --force --deep --sign - godot/build/mac/Gez.app || true
          # Start the exported game once and check the Swift part loads.
          GEZ_EXE="$(ls -d godot/build/mac/Gez.app/Contents/MacOS/* | head -1)"
          echo "Running $GEZ_EXE"
          ("$GEZ_EXE" --headless --quit-after 30 2>&1 || true) | tee /tmp/gez-run.log
          grep -q "1453 world loaded" /tmp/gez-run.log || { echo "::error::exported Mac game did not load the world"; exit 1; }
          ditto -c -k --sequesterRsrc --keepParent godot/build/mac/Gez.app godot/build/Gez-macOS.zip
      - name: Upload macOS export
        uses: actions/upload-artifact@v4
        with:
          name: gez-godot-macos
          path: godot/build/Gez-macOS.zip
          if-no-files-found: error

  godot-build-linux:
    name: Build & export Godot game (Linux)
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: ubuntu-latest
    # SwiftGodot v0.99.2 requires swift-tools-version 6.3.
    container: swift:6.3.2
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_DIR_VERSION: 4.7.2.stable
    steps:
      - uses: actions/checkout@v5
      - name: Install export dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq curl unzip patchelf libfontconfig1 libfreetype6 libx11-6 libxcursor1 libxext6 libxfixes3 libxi6 libxinerama1 libxrandr2 libxrender1 libgl1 >/dev/null
      - name: Build GezGodot (Linux release)
        run: ./godot/build_linux.sh release
      - name: Test GezGodot (Linux)
        run: swift test --package-path godot/swift
      - name: Bundle Swift Linux runtime libs
        run: |
          # Copy the Swift runtime next to the extension. (build_linux.sh has
          # already set RUNPATH=$ORIGIN, so ldd cannot be used to find them.)
          SWIFT_LIB="$(dirname "$(dirname "$(readlink -f "$(which swift)")")")/lib/swift/linux"
          echo "Swift runtime: $SWIFT_LIB"
          cp -L -f "$SWIFT_LIB"/*.so godot/bin/
          for f in godot/bin/*.so; do patchelf --set-rpath '$ORIGIN' "$f"; done
          # Fail here, not at the player's first launch, if anything is missing.
          if LD_LIBRARY_PATH= ldd godot/bin/libGezGodot.so godot/bin/libSwiftGodotRuntime.so | grep "not found"; then
            echo "::error::Swift libraries missing from godot/bin"; exit 1
          fi
          ls -la godot/bin
      - name: Install Godot & export templates
        run: |
          mkdir -p "${RUNNER_TEMP}/godot"
          curl -fsSL -o "${RUNNER_TEMP}/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "${RUNNER_TEMP}/godot/godot.zip" -d "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR_VERSION}"
          curl -fsSL -o "${RUNNER_TEMP}/godot/templates.tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -o "${RUNNER_TEMP}/godot/templates.tpz" -d "${RUNNER_TEMP}/godot/tpl"
          cp -R "${RUNNER_TEMP}/godot/tpl/templates/"* "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_DIR_VERSION}/"
      - name: Export Godot game (Linux)
        run: |
          GODOT_BIN="${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT_BIN" --headless --path godot --import
          mkdir -p godot/build/linux
          "$GODOT_BIN" --headless --path godot --export-release "Linux" build/linux/Gez.x86_64
          cp -n godot/bin/*.so* godot/build/linux/ || true
          ./godot/stage_resources.sh godot/build/linux/Resources
          if ldd godot/build/linux/libGezGodot.so | grep "not found"; then
            echo "::error::exported Linux game is missing Swift libraries"; exit 1
          fi
          # Start the exported game once and check the Swift part loads.
          timeout 300 godot/build/linux/Gez.x86_64 --headless --quit-after 30 2>&1 | tee /tmp/gez-run.log || true
          grep -q "1453 world loaded" /tmp/gez-run.log || { echo "::error::exported Linux game did not load the world"; exit 1; }
          tar -C godot/build/linux -czf godot/build/Gez-Linux-x86_64.tar.gz .
      - name: Upload Linux export
        uses: actions/upload-artifact@v4
        with:
          name: gez-godot-linux
          path: godot/build/Gez-Linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Upload Linux GDExtension binaries for screenshots
        uses: actions/upload-artifact@v4
        with:
          name: gez-gdextension-linux
          path: godot/bin/*.so*
          if-no-files-found: error

  godot-build-windows:
    name: Build & export Godot game (Windows)
    if: github.event_name != 'schedule' && inputs.only != 'profile'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GODOT_VERSION: 4.7.2-stable
      GODOT_TEMPLATE_DIR_VERSION: 4.7.2.stable
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3.2-release
          swift-build: 6.3.2-RELEASE
      - uses: actions/checkout@v5
      - name: Swift version
        run: swift --version
      - name: Build GezGodot (Windows release)
        shell: pwsh
        run: |
          subst S: "${{ github.workspace }}"
          & S:\godot\build_windows.ps1 -Config release
      - name: Install Godot & export templates
        shell: pwsh
        run: |
          $godotUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/Godot_v${env:GODOT_VERSION}_win64.exe.zip"
          Invoke-WebRequest -Uri $godotUrl -OutFile "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot" -Force
          $gui = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter *.exe | Where-Object { $_.Name -notlike "*_console.exe" } | Select-Object -First 1
          $console = Get-ChildItem "$env:RUNNER_TEMP\godot" -Filter *_console.exe | Select-Object -First 1
          Rename-Item $gui.FullName "godot.exe"
          Rename-Item $console.FullName "godot.console.exe"

          $tplDir = Join-Path $env:APPDATA "Godot\export_templates\$env:GODOT_TEMPLATE_DIR_VERSION"
          New-Item -ItemType Directory -Force -Path $tplDir | Out-Null
          $tplUrl = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION/Godot_v${env:GODOT_VERSION}_export_templates.tpz"
          Invoke-WebRequest -Uri $tplUrl -OutFile "$env:RUNNER_TEMP\templates.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\templates.zip" -DestinationPath "$env:RUNNER_TEMP\tpl" -Force
          Copy-Item -Recurse -Force "$env:RUNNER_TEMP\tpl\templates\*" $tplDir
      - name: Export Godot game (Windows)
        shell: pwsh
        run: |
          if (-not (Test-Path S:\)) { subst S: "${{ github.workspace }}" }
          $godotConsole = "$env:RUNNER_TEMP\godot\godot.console.exe"
          & $godotConsole --headless --path S:\godot --import
          New-Item -ItemType Directory -Force -Path S:\godot\build\windows | Out-Null
          & $godotConsole --headless --path S:\godot --export-release "Windows Desktop" build/windows/Gez.exe
          if ($LASTEXITCODE -ne 0) { throw "Godot Windows export failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path S:\godot\build\windows\Resources\data, S:\godot\build\windows\Resources\Terrain, S:\godot\build\windows\Resources\Heraldry | Out-Null
          Copy-Item -Force S:\Packages\GezCore\Sources\GezCore\Resources\* S:\godot\build\windows\Resources\data\
          Copy-Item -Force S:\App\Resources\Terrain\terrain.jpg S:\godot\build\windows\Resources\Terrain\
          Copy-Item -Force S:\App\Resources\Heraldry\*.png S:\godot\build\windows\Resources\Heraldry\
          Get-ChildItem S:\godot\bin -Filter *.dll | Copy-Item -Force -Destination S:\godot\build\windows\
          # Start the exported game once and check the Swift part loads.
          $exe = if (Test-Path S:\godot\build\windows\Gez.console.exe) { "S:\godot\build\windows\Gez.console.exe" } else { "S:\godot\build\windows\Gez.exe" }
          $log = & $exe --headless --quit-after 30 2>&1 | Out-String
          Write-Host $log
          if ($log -notmatch "1453 world loaded") { throw "exported Windows game did not load the world" }
          Compress-Archive -Path S:\godot\build\windows\* -DestinationPath S:\godot\build\Gez-Windows-x86_64.zip -Force
      - name: Upload Windows export
        uses: actions/upload-artifact@v4
        with:
          name: gez-godot-windows
          path: godot/build/Gez-Windows-x86_64.zip
          if-no-files-found: error

  godot-snapshots:
    name: Render Godot screenshots
    needs: [godot-build-linux]
    if: github.event_name != 'schedule' && inputs.only != 'profile' && inputs.only != 'windows'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v5
      - name: Download Linux GDExtension binaries
        uses: actions/download-artifact@v4
        with:
          name: gez-gdextension-linux
          path: godot/bin
      - name: Install Godot & Xvfb OpenGL deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-utils libgl1-mesa-dri libglx-mesa0 libfontconfig1 libfreetype6 libx11-6 libxcursor1 libxext6 libxfixes3 libxi6 libxinerama1 libxrandr2 libxrender1 >/dev/null
          mkdir -p "${RUNNER_TEMP}/godot"
          curl -fsSL -o "${RUNNER_TEMP}/godot/godot.zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q "${RUNNER_TEMP}/godot/godot.zip" -d "${RUNNER_TEMP}/godot"
          chmod +x "${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
      - name: Render Godot screenshots
        env:
          GEZ_GODOT_SNAPSHOT_DIR: ${{ github.workspace }}/godot-snapshots
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          GODOT_BIN="${RUNNER_TEMP}/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          "$GODOT_BIN" --headless --path godot --import
          xvfb-run -a -s "-screen 0 1600x960x24" \
            "$GODOT_BIN" --rendering-driver opengl3 --path godot --script res://scripts/capture_snapshots.gd
      - name: Upload Godot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-snapshots
          path: godot-snapshots
          if-no-files-found: error
      - name: Publish Godot screenshots to the ci-snapshots-preview branch
        # Runs started by hand on a pull request branch (gh workflow run
        # ci.yml --ref <branch>) publish their screenshots here, so reviewers
        # can see them without downloading artifacts.
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          WORKDIR="${RUNNER_TEMP}/ci-snapshots-preview"
          rm -rf "$WORKDIR" && mkdir -p "$WORKDIR/godot"
          cp -f godot-snapshots/*.png "$WORKDIR/godot/"
          cd "$WORKDIR"
          git init -q && git checkout -q --orphan ci-snapshots-preview
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "Godot preview screenshots for ${GITHUB_REF_NAME} ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots-preview
      - name: Publish Godot screenshots to ci-snapshots branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          WORKDIR="${RUNNER_TEMP}/ci-snapshots-godot"
          rm -rf "$WORKDIR"
          if ! git clone --depth 1 --branch ci-snapshots "$REPO_URL" "$WORKDIR" 2>/dev/null; then
            git init -q "$WORKDIR"
            git -C "$WORKDIR" checkout -q --orphan ci-snapshots
            git -C "$WORKDIR" remote add origin "$REPO_URL"
          fi
          mkdir -p "$WORKDIR/godot"
          rm -f "$WORKDIR/godot/"*.png
          cp -f godot-snapshots/*.png "$WORKDIR/godot/"
          cd "$WORKDIR"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -q -m "Godot snapshots for ${GITHUB_SHA}" || exit 0
          for i in 1 2 3; do
            git push -q origin ci-snapshots && break
            git fetch -q origin ci-snapshots && git rebase -q origin/ci-snapshots
          done

  profile:
    # Times each system of the daily tick (ProfileTests). By hand only:
    # gh workflow run ci.yml --ref <branch> -f only=profile
    name: Profile the daily tick (Linux)
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'profile'
    runs-on: ubuntu-latest
    container: swift:6.0
    timeout-minutes: 60
    env:
      GEZ_PROFILE: "1"
      GEZ_PROFILE_DAYS: "400"
      GEZ_PROFILE_SEED: "7"
      # Also prints a monthly checksum of the world for 2 years: compare the
      # FINGERPRINT lines of two branches to prove a speed-up changes nothing.
      GEZ_FINGERPRINT: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Profile and fingerprint
        run: swift test -c release -Xswiftc -enable-testing --package-path Packages/GezCore --filter 'testSystemTimings|testPrintFingerprints' 2>&1 | grep -E "PROFILE|FINGERPRINT|passed|failed|error"
