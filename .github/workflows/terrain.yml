name: Fetch elevation

# Downloads public elevation data (needs internet, which the cloud workspace
# doesn't have) for the map box in scenario1453.json, then bakes the terrain
# picture and the 3D height map from it, and commits all three to the branch
# it ran on. Runs when the fetch script changes on main, or by hand:
#   gh workflow run terrain.yml --ref <branch>
# (REST: gh api -X POST repos/theRealMaReza/gez/actions/workflows/terrain.yml/dispatches -f ref=<branch>)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/terrain/fetch_elevation.py

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy pillow
      - run: python3 tools/terrain/fetch_elevation.py
      - run: python3 tools/terrain/bake_terrain.py
      - run: python3 tools/terrain/bake_heightmap.py
      - name: Commit elevation and baked terrain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/terrain/elevation.png App/Resources/Terrain/terrain.jpg App/Resources/Terrain/height.png App/Resources/Terrain/edges.png docs/terrain_preview.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Update elevation and baked terrain (fetched by CI)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
